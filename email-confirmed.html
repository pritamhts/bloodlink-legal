<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Email Verified | BloodLink</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fff5f5;
      color: #292323;
      font-family: system-ui, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 32px 24px;
      border-radius: 20px;
      background: white;
      text-align: center;
      box-shadow: 0 8px 32px #5a000018;
    }
    .check {
      margin: 0 auto 16px;
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #e4f7e9;
      color: #18763b;
      font-size: 36px;
    }
    h1 { color: #b51225; font-size: 27px; }
    p { line-height: 1.7; }
    a { color: #b51225; }
    .note {
      margin-top: 22px;
      padding: 14px;
      border-radius: 12px;
      background: #fff1f1;
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">&#10003;</div>
    <h1>Email verified successfully!</h1>
    <p lang="bn">আপনার ইমেইল সফলভাবে যাচাই করা হয়েছে।</p>
    <div class="note">
      <strong lang="bn">পরবর্তী ধাপ</strong>
      <p lang="bn">BloodLink অ্যাপে ফিরে আপনার ইমেইল ও পাসওয়ার্ড দিয়ে Login করুন।</p>
    </div>
    <p>
      <a href="./">BloodLink ওয়েবসাইটে ফিরে যান</a>
    </p>
  </main>
</body>
</html>
